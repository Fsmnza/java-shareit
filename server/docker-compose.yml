shareit-server:
  build:
    context: .
    dockerfile: server/Dockerfile
  container_name: shareit-server
  ports:
    - "9090:9090"
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
    SPRING_DATASOURCE_USERNAME: malika
    SPRING_DATASOURCE_PASSWORD: password
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
  test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
  interval: 5s
  timeout: 2s
  retries: 20

