version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: shareit-postgres
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: malika
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  shareit-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: shareit-server
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: malika
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres

  shareit-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    environment:
      SHAREIT_SERVER_URL: http://shareit-server:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: malika
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - shareit-server

volumes:
  postgres-data:
