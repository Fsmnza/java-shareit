version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: malika
      POSTGRES_PASSWORD: password
    ports:
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malika"]
      interval: 5s
      timeout: 5s
      retries: 5

  shareit-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: malika
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

  shareit-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SHAREIT_SERVER_URL: http://shareit-server:9090
    depends_on:
      - shareit-server

volumes:
  db-data:
